<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%">
  <defs>
    <!-- Font family declaration -->
    <style>
      .title { font-family: 'system-ui', -apple-system, sans-serif; font-weight: 800; font-size: 24px; fill: #f8fafc; }
      .subtitle { font-family: 'system-ui', -apple-system, sans-serif; font-weight: 400; font-size: 14px; fill: #94a3b8; }
      .node-title { font-family: 'system-ui', -apple-system, sans-serif; font-weight: 700; font-size: 15px; fill: #ffffff; }
      .node-text { font-family: 'system-ui', -apple-system, sans-serif; font-weight: 500; font-size: 12px; fill: #cbd5e1; }
      .code-text { font-family: 'Courier New', Courier, monospace; font-weight: bold; font-size: 11px; fill: #38bdf8; }
      .arrow-text { font-family: 'system-ui', -apple-system, sans-serif; font-weight: 600; font-size: 11px; fill: #64748b; text-anchor: middle; }
    </style>

    <!-- Glowing Shadows -->
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#020617" flood-opacity="0.6"/>
    </filter>

    <!-- Color Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="grad-server" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <linearGradient id="grad-zip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>

    <linearGradient id="grad-geojson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>

    <linearGradient id="grad-leaflet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="33%" stop-color="#8b5cf6" />
      <stop offset="66%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="480" rx="24" fill="url(#bg-grad)" stroke="#334155" stroke-width="2" />
  
  <!-- Subtle Grid Overlay -->
  <path d="M 0,80 L 1000,80 M 0,160 L 1000,160 M 0,240 L 1000,240 M 0,320 L 1000,320 M 0,400 L 1000,400 M 100,0 L 100,480 M 200,0 L 200,480 M 300,0 L 300,480 M 400,0 L 400,480 M 500,0 L 500,480 M 600,0 L 600,480 M 700,0 L 700,480 M 800,0 L 800,480 M 900,0 L 900,480" fill="none" stroke="#1e293b" stroke-width="0.5" opacity="0.3"/>

  <!-- Diagram Title -->
  <g transform="translate(40, 45)">
    <text class="title" x="0" y="0">Fluxo de Dados 100% Client-Side (No Navegador)</text>
    <text class="subtitle" x="0" y="24">Como os arquivos Shapefile (.zip) são carregados, descompactados, convertidos e renderizados dinamicamente.</text>
  </g>

  <!-- Flow Line Background -->
  <path d="M 120,240 L 880,240" fill="none" stroke="url(#line-grad)" stroke-width="6" opacity="0.15" stroke-linecap="round" />

  <!-- ==================== STEP 1: SERVIDOR WEB ==================== -->
  <g transform="translate(40, 150)" filter="url(#shadow)">
    <!-- Node Card -->
    <rect width="160" height="180" rx="16" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
    <!-- Header Indicator -->
    <rect width="160" height="40" rx="0" fill="url(#grad-server)" clip-path="inset(0 0 140 0 round 16)" />
    <!-- Icon Placeholder (Server / Cloud) -->
    <path d="M 80,18 C 88,18 90,22 92,24 C 94,26 98,26 98,28 M 80,12 C 72,12 70,16 68,18 C 66,20 62,20 62,22" fill="none" stroke="#ffffff" stroke-width="2" />
    <circle cx="80" cy="20" r="8" fill="none" stroke="#ffffff" stroke-width="2"/>
    <text class="node-title" x="80" y="65" text-anchor="middle">1. Servidor Web</text>
    <text class="node-text" x="80" y="88" text-anchor="middle">Hospeda arquivos ZIP</text>
    <text class="node-text" x="80" y="104" text-anchor="middle">originais do Shapefile</text>
    <text class="code-text" x="80" y="135" text-anchor="middle">.zip (SHP, DBF, PRJ)</text>
    <rect x="20" y="148" width="120" height="20" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text class="node-text" x="80" y="162" text-anchor="middle" font-size="10" fill="#94a3b8">Espaço reduzido: ZIP</text>
  </g>

  <!-- Connection Arrow 1-2 -->
  <g transform="translate(200, 240)">
    <path d="M 0,0 L 40,0" fill="none" stroke="#3b82f6" stroke-width="3" stroke-dasharray="4,4" />
    <polygon points="40,-6 52,0 40,6" fill="#3b82f6" />
    <text class="arrow-text" x="20" y="-12">fetch()</text>
    <text class="arrow-text" x="20" y="24" font-size="9" fill="#94a3b8">ArrayBuffer</text>
  </g>

  <!-- ==================== STEP 2: JSZIP ==================== -->
  <g transform="translate(260, 150)" filter="url(#shadow)">
    <rect width="160" height="180" rx="16" fill="#1e293b" stroke="#8b5cf6" stroke-width="2" />
    <rect width="160" height="40" rx="0" fill="url(#grad-zip)" clip-path="inset(0 0 140 0 round 16)" />
    <!-- Zip Icon -->
    <path d="M 72,12 L 88,12 L 88,28 L 72,28 Z M 76,16 L 84,16 M 76,20 L 84,20 M 76,24 L 84,24" fill="none" stroke="#ffffff" stroke-width="2" />
    <text class="node-title" x="80" y="65" text-anchor="middle">2. JSZip (Memória)</text>
    <text class="node-text" x="80" y="88" text-anchor="middle">Descompacta o ZIP</text>
    <text class="node-text" x="80" y="104" text-anchor="middle">em tempo de execução</text>
    <text class="code-text" x="80" y="135" text-anchor="middle">new JSZip()</text>
    <rect x="20" y="148" width="120" height="20" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text class="node-text" x="80" y="162" text-anchor="middle" font-size="10" fill="#94a3b8">Zero requisições extras</text>
  </g>

  <!-- Connection Arrow 2-3 -->
  <g transform="translate(420, 240)">
    <path d="M 0,0 L 40,0" fill="none" stroke="#8b5cf6" stroke-width="3" />
    <polygon points="40,-6 52,0 40,6" fill="#8b5cf6" />
    <text class="arrow-text" x="20" y="-12">Parse binário</text>
    <text class="arrow-text" x="20" y="24" font-size="9" fill="#94a3b8">shp()</text>
  </g>

  <!-- ==================== STEP 3: SHPJS ==================== -->
  <g transform="translate(480, 150)" filter="url(#shadow)">
    <rect width="160" height="180" rx="16" fill="#1e293b" stroke="#ec4899" stroke-width="2" />
    <rect width="160" height="40" rx="0" fill="url(#grad-geojson)" clip-path="inset(0 0 140 0 round 16)" />
    <!-- Parsing Icon -->
    <path d="M 72,15 L 80,12 L 88,15 L 88,25 L 80,28 L 72,25 Z" fill="none" stroke="#ffffff" stroke-width="2"/>
    <path d="M 80,12 L 80,28" fill="none" stroke="#ffffff" stroke-width="1" />
    <text class="node-title" x="80" y="65" text-anchor="middle">3. shp.js (Conversor)</text>
    <text class="node-text" x="80" y="88" text-anchor="middle">Converte binários de</text>
    <text class="node-text" x="80" y="104" text-anchor="middle">geometria e atributos</text>
    <text class="code-text" x="80" y="135" text-anchor="middle">GeoJSON Output</text>
    <rect x="20" y="148" width="120" height="20" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text class="node-text" x="80" y="162" text-anchor="middle" font-size="10" fill="#94a3b8">WGS84 Lat/Long Proj</text>
  </g>

  <!-- Connection Arrow 3-4 -->
  <g transform="translate(640, 240)">
    <path d="M 0,0 L 40,0" fill="none" stroke="#ec4899" stroke-width="3" />
    <polygon points="40,-6 52,0 40,6" fill="#ec4899" />
    <text class="arrow-text" x="20" y="-12">L.geoJSON()</text>
    <text class="arrow-text" x="20" y="24" font-size="9" fill="#94a3b8">Render</text>
  </g>

  <!-- ==================== STEP 4: LEAFLET.JS ==================== -->
  <g transform="translate(700, 150)" filter="url(#shadow)">
    <rect width="160" height="180" rx="16" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <rect width="160" height="40" rx="0" fill="url(#grad-leaflet)" clip-path="inset(0 0 140 0 round 16)" />
    <!-- Map Icon -->
    <path d="M 72,12 L 80,18 L 88,12 L 88,28 L 80,22 L 72,28 Z" fill="none" stroke="#ffffff" stroke-width="2" />
    <path d="M 80,18 L 80,22" fill="none" stroke="#ffffff" stroke-width="2" />
    <text class="node-title" x="80" y="65" text-anchor="middle">4. Leaflet Engine</text>
    <text class="node-text" x="80" y="88" text-anchor="middle">Renderiza as camadas</text>
    <text class="node-text" x="80" y="104" text-anchor="middle">e anexa os popups</text>
    <text class="code-text" x="80" y="135" text-anchor="middle">L.map('map')</text>
    <rect x="20" y="148" width="120" height="20" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text class="node-text" x="80" y="162" text-anchor="middle" font-size="10" fill="#94a3b8">SVG Vetores Interativos</text>
  </g>

  <!-- Connection Arrow 4-End -->
  <g transform="translate(860, 240)">
    <path d="M 0,0 L 30,0" fill="none" stroke="#10b981" stroke-width="3" stroke-dasharray="4,4" />
    <polygon points="30,-6 42,0 30,6" fill="#10b981" />
  </g>

  <!-- ==================== SCREEN OUTLINE ==================== -->
  <g transform="translate(900, 190)" filter="url(#shadow)">
    <!-- Small Screen Icon -->
    <rect width="60" height="100" rx="8" fill="#0f172a" stroke="#475569" stroke-width="2" />
    <!-- Screen Header -->
    <rect x="4" y="4" width="52" height="12" rx="2" fill="#1e293b" />
    <!-- Map Shape Sketch -->
    <path d="M 12,45 C 18,35 25,48 35,40 C 45,32 40,55 48,58" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
    <circle cx="35" cy="40" r="3" fill="#f43f5e" />
    <text class="node-text" x="30" y="88" text-anchor="middle" font-size="9" fill="#94a3b8">UI Mapa</text>
  </g>

  <!-- Advantages & Info Footer -->
  <g transform="translate(40, 375)">
    <rect width="920" height="65" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <!-- Info bullet 1 -->
    <circle cx="30" cy="32" r="5" fill="#3b82f6" />
    <text class="node-text" x="45" y="36" font-weight="600" fill="#f8fafc">Sem Servidor SIG:</text>
    <text class="node-text" x="160" y="36">Não precisa de GeoServer ou banco de dados PostGIS. Hospedagem 100% estática (GitHub Pages).</text>

    <!-- Info bullet 2 -->
    <circle cx="530" cy="32" r="5" fill="#10b981" />
    <text class="node-text" x="545" y="36" font-weight="600" fill="#f8fafc">Performance:</text>
    <text class="node-text" x="635" y="36">Ideal para shapes de médio porte. Compactação ZIP economiza banda e tempo de rede.</text>
  </g>
</svg>
