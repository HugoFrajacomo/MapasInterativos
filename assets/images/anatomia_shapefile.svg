<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%">
  <defs>
    <!-- Font family declaration -->
    <style>
      .title { font-family: 'system-ui', -apple-system, sans-serif; font-weight: 800; font-size: 24px; fill: #f8fafc; }
      .subtitle { font-family: 'system-ui', -apple-system, sans-serif; font-weight: 400; font-size: 14px; fill: #94a3b8; }
      .node-title { font-family: 'system-ui', -apple-system, sans-serif; font-weight: 700; font-size: 16px; }
      .node-text { font-family: 'system-ui', -apple-system, sans-serif; font-weight: 500; font-size: 12px; fill: #cbd5e1; }
      .tag-text { font-family: 'system-ui', -apple-system, sans-serif; font-weight: 700; font-size: 10px; fill: #ffffff; }
      .info-title { font-family: 'system-ui', -apple-system, sans-serif; font-weight: 700; font-size: 14px; fill: #f8fafc; }
      .info-desc { font-family: 'system-ui', -apple-system, sans-serif; font-weight: 400; font-size: 12px; fill: #94a3b8; }
    </style>

    <!-- Glowing Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#020617" flood-opacity="0.6"/>
    </filter>

    <!-- Color Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="grad-shp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <linearGradient id="grad-dbf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <linearGradient id="grad-shx" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>

    <linearGradient id="grad-prj" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    
    <linearGradient id="grad-cpg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="480" rx="24" fill="url(#bg-grad)" stroke="#334155" stroke-width="2" />
  
  <!-- Subtle Grid Overlay -->
  <path d="M 0,80 L 1000,80 M 0,160 L 1000,160 M 0,240 L 1000,240 M 0,320 L 1000,320 M 0,400 L 1000,400 M 100,0 L 100,480 M 200,0 L 200,480 M 300,0 L 300,480 M 400,0 L 400,480 M 500,0 L 500,480 M 600,0 L 600,480 M 700,0 L 700,480 M 800,0 L 800,480 M 900,0 L 900,480" fill="none" stroke="#1e293b" stroke-width="0.5" opacity="0.3"/>

  <!-- Diagram Title -->
  <g transform="translate(40, 45)">
    <text class="title" x="0" y="0">Anatomia Física de um Shapefile</text>
    <text class="subtitle" x="0" y="24">Entenda o papel de cada arquivo contido no pacote .ZIP para compor o mapa completo.</text>
  </g>

  <!-- Left: Main ZIP Container Graphic -->
  <g transform="translate(40, 110)" filter="url(#shadow)">
    <!-- Big Zip Box border -->
    <rect width="250" height="330" rx="20" fill="#1e293b" stroke="#475569" stroke-width="2" stroke-dasharray="6,6" opacity="0.6"/>
    <!-- Zip Icon / Tag -->
    <rect x="20" y="-12" width="100" height="24" rx="12" fill="#64748b" />
    <text class="tag-text" x="70" y="4" text-anchor="middle" alignment-baseline="middle">PACOTE .ZIP</text>
    
    <!-- Visual Representation of Zip Contents -->
    <rect x="25" y="40" width="200" height="45" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
    <text class="node-title" x="40" y="67" fill="#3b82f6" font-size="14">mapa.shp</text>
    <circle cx="200" cy="62" r="5" fill="#3b82f6"/>
    
    <rect x="25" y="95" width="200" height="45" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <text class="node-title" x="40" y="122" fill="#10b981" font-size="14">mapa.dbf</text>
    <circle cx="200" cy="117" r="5" fill="#10b981"/>
    
    <rect x="25" y="150" width="200" height="45" rx="8" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5"/>
    <text class="node-title" x="40" y="177" fill="#8b5cf6" font-size="14">mapa.shx</text>
    <circle cx="200" cy="172" r="5" fill="#8b5cf6"/>
    
    <rect x="25" y="205" width="200" height="45" rx="8" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5"/>
    <text class="node-title" x="40" y="232" fill="#f43f5e" font-size="14">mapa.prj</text>
    <circle cx="200" cy="227" r="5" fill="#f43f5e"/>

    <rect x="25" y="260" width="200" height="45" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <text class="node-title" x="40" y="287" fill="#f59e0b" font-size="14">mapa.cpg</text>
    <circle cx="200" cy="282" r="5" fill="#f59e0b"/>
  </g>

  <!-- Connective lines from Zip package to Detailed Cards -->
  <!-- Line to SHP -->
  <path d="M 240,172 L 320,150" fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.6"/>
  <!-- Line to DBF -->
  <path d="M 240,172 L 320,230" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.6"/>
  <!-- Line to SHX -->
  <path d="M 240,172 L 320,310" fill="none" stroke="#8b5cf6" stroke-width="1.5" opacity="0.6"/>
  <!-- Line to PRJ -->
  <path d="M 240,172 L 670,190" fill="none" stroke="#f43f5e" stroke-width="1.5" opacity="0.6"/>
  <!-- Line to CPG -->
  <path d="M 240,172 L 670,310" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.6"/>

  <!-- ==================== DETAILED COMPONENT CARDS ==================== -->
  
  <!-- MANDATORY COLUMN -->
  <text class="tag-text" x="475" y="105" fill="#94a3b8" text-anchor="middle" letter-spacing="1">1. ARQUIVOS OBRIGATÓRIOS (CORE)</text>
  
  <!-- CARD 1: .SHP -->
  <g transform="translate(320, 120)" filter="url(#shadow)">
    <rect width="310" height="70" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
    <rect width="10" height="70" rx="0" fill="url(#grad-shp)" clip-path="inset(0 0 0 0 round 12 0 0 12)" />
    <text class="node-title" x="30" y="28" fill="#3b82f6">.SHP (Shape Geometry)</text>
    <text class="node-text" x="30" y="48">Guarda as formas geográficas puras (Polígonos, Linhas, Pontos).</text>
    <rect x="210" y="10" width="85" height="18" rx="4" fill="#1e3a8a" />
    <text class="tag-text" x="252.5" y="22" text-anchor="middle">OBRIGATÓRIO</text>
  </g>

  <!-- CARD 2: .DBF -->
  <g transform="translate(320, 200)" filter="url(#shadow)">
    <rect width="310" height="70" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <rect width="10" height="70" rx="0" fill="url(#grad-dbf)" clip-path="inset(0 0 0 0 round 12 0 0 12)" />
    <text class="node-title" x="30" y="28" fill="#10b981">.DBF (Attribute Database)</text>
    <text class="node-text" x="30" y="48">Banco de dados dBASE contendo os dados alfanuméricos.</text>
    <rect x="210" y="10" width="85" height="18" rx="4" fill="#065f46" />
    <text class="tag-text" x="252.5" y="22" text-anchor="middle">OBRIGATÓRIO</text>
  </g>

  <!-- CARD 3: .SHX -->
  <g transform="translate(320, 280)" filter="url(#shadow)">
    <rect width="310" height="70" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="2" />
    <rect width="10" height="70" rx="0" fill="url(#grad-shx)" clip-path="inset(0 0 0 0 round 12 0 0 12)" />
    <text class="node-title" x="30" y="28" fill="#8b5cf6">.SHX (Shape Index)</text>
    <text class="node-text" x="30" y="48">Vincula a geometria (.shp) aos atributos da tabela (.dbf).</text>
    <rect x="210" y="10" width="85" height="18" rx="4" fill="#5b21b6" />
    <text class="tag-text" x="252.5" y="22" text-anchor="middle">OBRIGATÓRIO</text>
  </g>
  
  <!-- OPTIONAL/METADATA COLUMN -->
  <text class="tag-text" x="815" y="105" fill="#94a3b8" text-anchor="middle" letter-spacing="1">2. METADADOS E PROJEÇÕES</text>

  <!-- CARD 4: .PRJ -->
  <g transform="translate(660, 120)" filter="url(#shadow)">
    <rect width="300" height="110" rx="12" fill="#1e293b" stroke="#f43f5e" stroke-width="2" />
    <rect width="10" height="110" rx="0" fill="url(#grad-prj)" clip-path="inset(0 0 0 0 round 12 0 0 12)" />
    <text class="node-title" x="30" y="28" fill="#f43f5e">.PRJ (Projection CRS)</text>
    <text class="node-text" x="30" y="48">Define o sistema de referência e projeção</text>
    <text class="node-text" x="30" y="64">geográfica (ex: WGS 84, SIRGAS 2000).</text>
    <text class="node-text" x="30" y="82" fill="#94a3b8">Sem ele, o mapa fica "deslocado" no globo.</text>
    <rect x="200" y="10" width="85" height="18" rx="4" fill="#9f1239" />
    <text class="tag-text" x="242.5" y="22" text-anchor="middle">RECOMENDADO</text>
  </g>

  <!-- CARD 5: .CPG -->
  <g transform="translate(660, 240)" filter="url(#shadow)">
    <rect width="300" height="110" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
    <rect width="10" height="110" rx="0" fill="url(#grad-cpg)" clip-path="inset(0 0 0 0 round 12 0 0 12)" />
    <text class="node-title" x="30" y="28" fill="#f59e0b">.CPG (Codepage Format)</text>
    <text class="node-text" x="30" y="48">Identifica a codificação dos textos tabulares</text>
    <text class="node-text" x="30" y="64">(ex: UTF-8, Windows-1252).</text>
    <text class="node-text" x="30" y="82" fill="#94a3b8">Evita que acentos virem símbolos estranhos.</text>
    <rect x="200" y="10" width="85" height="18" rx="4" fill="#78350f" />
    <text class="tag-text" x="242.5" y="22" text-anchor="middle">OPCIONAL</text>
  </g>

  <!-- Interactive/Integration Legend Footer -->
  <g transform="translate(320, 370)">
    <rect width="640" height="70" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <circle cx="25" cy="35" r="6" fill="#f43f5e" />
    <text class="info-title" x="40" y="32">Por que zippar no WebGIS Client-Side?</text>
    <text class="info-desc" x="40" y="52">O shapefile é composto por múltiplos arquivos individuais com o mesmo nome base.</text>
    <text class="info-desc" x="40" y="68">O empacotamento ZIP une-os em um único arquivo, tornando a transferência na web viável e rápida.</text>
  </g>
</svg>
